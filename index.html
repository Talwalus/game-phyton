<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Miku Python Guessing Game</title>
<script src="https://cdn.jsdelivr.net/npm/brython@3.9.5/brython.min.js"></script>

<style>
    body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #39c5bb, #71d9f5);
        color: #fff;
    }
    .container {
        max-width: 500px;
        margin: 80px auto;
        padding: 30px;
        background: rgba(0,0,0,0.25);
        border-radius: 15px;
        text-align: center;
        backdrop-filter: blur(6px);
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    input {
        width: 80%;
        padding: 12px;
        border-radius: 10px;
        border: 2px solid #39c5bb;
        font-size: 18px;
        margin-bottom: 20px;
    }
    button {
        padding: 12px 30px;
        background: #39c5bb;
        border: none;
        border-radius: 10px;
        font-size: 18px;
        color: #fff;
        cursor: pointer;
    }
    .msg {
        margin-top: 20px;
        font-size: 22px;
        min-height: 40px;
    }
    .miku-img {
        width: 220px;
        margin-top: 20px;
        filter: drop-shadow(0 0 10px #fff);
    }
</style>
</head>

<body onload="brython()">

<div class="container">
    <h1>🎤 Hatsune Miku Python Guessing Game 🎶</h1>
    
    <input id="guess" type="number" placeholder="Enter your guess…">
    <br>
    <button id="check">Guess</button>

    <div style="margin-top:12px;">
        <strong>Attempts:</strong> <span id="attempts">0</span>
        &nbsp;&nbsp; <strong>Best:</strong> <span id="best">-</span>
    </div>

    <div class="msg" id="message"></div>
    <div style="margin-top:8px; font-size:16px; opacity:0.95;">Range: <span id="range">1 - 100</span></div>

    <img src="assets/miku.svg" class="miku-img" alt="Miku">
</div>

<!-- Audio is synthesized locally with WebAudio; external files removed -->

<script type="text/python">
from browser import document, window
import random

secret = random.randint(1, 100)
attempts = 0
min_range = 1
max_range = 100

def load_best():
    try:
        b = window.localStorage.getItem('best')
        return int(b) if b is not None else None
    except Exception:
        return None

def save_best(value):
    try:
        window.localStorage.setItem('best', str(value))
    except Exception:
        pass

best = load_best()
if best is not None:
    document['best'].text = str(best)

def update_range_display():
    document['range'].text = f"{min_range} - {max_range}"

def enable_guess_button():
    try:
        if 'disabled' in document['check'].attrs:
            del document['check'].attrs['disabled']
    except Exception:
        pass

def disable_guess_button():
    try:
        document['check'].attrs['disabled'] = 'disabled'
    except Exception:
        pass

def play(sound_id):
    # Synthesize simple tones using the WebAudio API (no external files)
    try:
        try:
            ctx = window.AudioContext()
        except Exception:
            try:
                ctx = window.webkitAudioContext()
            except Exception:
                ctx = None

        if ctx is None:
            return

        disable_guess_button()

        def tone(freq, duration_ms, volume=0.12):
            osc = ctx.createOscillator()
            gain = ctx.createGain()
            osc.type = 'sine'
            osc.frequency.value = freq
            gain.gain.value = volume
            osc.connect(gain)
            gain.connect(ctx.destination)
            try:
                osc.start()
            except Exception:
                pass

            from browser import timer
            def stop_osc():
                try:
                    osc.stop()
                except Exception:
                    pass
                try:
                    enable_guess_button()
                except Exception:
                    pass

            timer.set_timeout(stop_osc, duration_ms)

        # Map IDs to tones or short melodies
        if sound_id == 'voice_low':
            tone(220, 450)
        elif sound_id == 'voice_high':
            tone(880, 350)
        elif sound_id == 'voice_correct':
            # short success melody
            tone(660, 150)
            from browser import timer
            timer.set_timeout(lambda: tone(880, 200, 0.09), 160)
            timer.set_timeout(lambda: tone(1040, 260, 0.08), 380)
        else:
            tone(440, 200)

    except Exception:
        try:
            enable_guess_button()
        except Exception:
            pass

def check(ev):
    global secret, attempts, min_range, max_range, best
    msg = document["message"]
    guess_value = document["guess"].value

    if guess_value is None or str(guess_value).strip() == "":
        msg.text = "Enter a number!"
        return

    # Accept numeric input (including floats) but convert to int
    try:
        guess = int(float(guess_value))
    except Exception:
        msg.text = "Invalid number!"
        return

    # Update attempts
    attempts += 1
    document['attempts'].text = str(attempts)

    if guess < min_range or guess > max_range:
        msg.text = f"Out of current range! {min_range} - {max_range}"
        return

    if guess < secret:
        msg.text = "Too low! 📉"
        # narrow range
        if guess + 1 > min_range:
            min_range = max(min_range, guess + 1)
        update_range_display()
        play("voice_low")

    elif guess > secret:
        msg.text = "Too high! 📈"
        if guess - 1 < max_range:
            max_range = min(max_range, guess - 1)
        update_range_display()
        play("voice_high")

    else:
        msg.text = f"Correct! You win! 🎉💙 The number was {secret}. Attempts: {attempts}."
        play("voice_correct")
        # Update best score
        if best is None or attempts < best:
            best = attempts
            document['best'].text = str(best)
            save_best(best)

        # reset game
        secret = random.randint(1, 100)
        attempts = 0
        min_range = 1
        max_range = 100
        document['attempts'].text = '0'
        update_range_display()

document["check"].bind("click", check)
# mark as bound so JS fallback won't double-bind
try:
    document['check'].attrs['data-brython'] = '1'
    document['guess'].attrs['data-brython'] = '1'
except Exception:
    pass

# Allow pressing Enter in the input to submit the guess
def on_keydown(ev):
    try:
        if getattr(ev, 'keyCode', None) == 13 or getattr(ev, 'key', None) == 'Enter':
            check(ev)
    except Exception:
        pass

document["guess"].bind("keydown", on_keydown)

update_range_display()
try:
    window.__game_check = check
except Exception:
    pass
</script>

<!-- JS fallback: if Brython didn't initialize, bind a simple JS handler so the UI still works -->
<script>
// remove disabled attribute if present
document.addEventListener('DOMContentLoaded', function(){
    var btn = document.getElementById('check');
    if (btn && btn.hasAttribute('disabled')) btn.removeAttribute('disabled');

    // Always attach a small handler that calls the Brython check if present,
    // otherwise runs a simple JS fallback. This avoids missing clicks.
    var bestEl = document.getElementById('best');
    var attemptsEl = document.getElementById('attempts');
    var msg = document.getElementById('message');
    var rangeEl = document.getElementById('range');
    var jsAttempts = 0;
    var jsMin = 1, jsMax = 100, jsSecret = Math.floor(Math.random()*100)+1;

    function jsUpdateRange(){ if (rangeEl) rangeEl.textContent = jsMin + ' - ' + jsMax; }
    jsUpdateRange();

    function jsDoCheck(){
        var val = document.getElementById('guess').value;
        if (!val || String(val).trim() === ''){ if (msg) msg.textContent = 'Enter a number!'; return; }
        var guess = parseInt(parseFloat(val));
        if (isNaN(guess)){ if (msg) msg.textContent = 'Invalid number!'; return; }
        jsAttempts += 1; if (attemptsEl) attemptsEl.textContent = jsAttempts;
        if (guess < jsMin || guess > jsMax){ if (msg) msg.textContent = 'Out of current range! ' + jsMin + ' - ' + jsMax; return; }
        if (guess < jsSecret){ if (msg) msg.textContent = 'Too low! 📉'; jsMin = Math.max(jsMin, guess+1); jsUpdateRange(); }
        else if (guess > jsSecret){ if (msg) msg.textContent = 'Too high! 📈'; jsMax = Math.min(jsMax, guess-1); jsUpdateRange(); }
        else { if (msg) msg.textContent = 'Correct! You win! 🎉💙 The number was ' + jsSecret + '. Attempts: ' + jsAttempts + '.';
                     try{ var b = localStorage.getItem('best'); b = b?parseInt(b):null; if (!b || jsAttempts < b){ localStorage.setItem('best', String(jsAttempts)); if (bestEl) bestEl.textContent = String(jsAttempts); } }catch(e){}
                     jsSecret = Math.floor(Math.random()*100)+1; jsAttempts = 0; if (attemptsEl) attemptsEl.textContent = '0'; jsMin = 1; jsMax = 100; jsUpdateRange(); }
    }

    function clickHandler(e){
        // prefer Brython-exported function if present
        try{
            if (window.__game_check){
                // Brython function may expect an event; call it
                try{ window.__game_check(e); return; } catch(err){}
            }
        }catch(err){}
        // fallback to JS
        jsDoCheck();
    }

    if (btn) btn.addEventListener('click', clickHandler);
    var input = document.getElementById('guess');
    if (input) input.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') clickHandler(ev); });
});
</script>

</body>
</html>
